<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Где меня найти</title>
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;

            /* Фиолетовый градиент в точной гамме со скриншота */
            background-color: #59427b;
            background-image: 
                radial-gradient(circle at 50% 30%, #765a9d 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, #463065 0%, transparent 50%),
                linear-gradient(135deg, #674c8f 0%, #3e295b 100%);
        }

        /* Мягкая текстура шума и волн на фоне */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 0, 0, 0.25) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Светлые кнопки в стиле Material 3 под тёмный фиолетовый фон */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 18px 24px;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: #2b184f;
            background-color: #e4d8ff;
            cursor: pointer;
            border: none;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .btn:hover {
            background-color: #f0e8ff;
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #d3c0f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .btn i {
            font-size: 22px;
            margin-right: 16px;
            color: #553b88;
            width: 24px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .btn:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            background: rgba(85, 59, 136, 0.25);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Где меня найти:</h1>

        <div class="links">
            <a href="https://t.me/xxpeakx" target="_blank" class="btn">
                <i class="fa-brands fa-telegram"></i>
                <span>Telegram</span>
            </a>

            <a href="https://discordapp.com/users/1464303389646000261" target="_blank" class="btn">
                <i class="fa-brands fa-discord"></i>
                <span>Discord</span>
            </a>

            <a href="https://steamcommunity.com/profiles/76561199866082489" target="_blank" class="btn">
                <i class="fa-brands fa-steam"></i>
                <span>Steam</span>
            </a>

            <a href="https://github.com/femboysobak" target="_blank" class="btn">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;

                const rect = this.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = this.querySelector('.ripple');
                if (ripple) {
                    ripple.remove();
                }

                this.appendChild(circle);
            });
        });
    </script>
</body>
</html>
