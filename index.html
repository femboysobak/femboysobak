<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Где меня найти</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #6c5ce7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            border-radius: 22px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: #ffffff;
            color: #333333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Идивидуальные акцентные цвета для кнопок */
        .btn-telegram {
            color: #24A1DE;
        }

        .btn-discord {
            color: #5865F2;
        }

        .btn-steam {
            color: #171a21;
        }

        .btn-github {
            color: #24292e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Где меня найти:</h1>

        <div class="links">
            <a href="https://t.me/xxpeakx" target="_blank" class="btn btn-telegram">
                Telegram
            </a>

            <a href="https://discordapp.com/users/1464303389646000261" target="_blank" class="btn btn-discord">
                Discord
            </a>

            <a href="https://steamcommunity.com/profiles/76561199866082489" target="_blank" class="btn btn-steam">
                Steam
            </a>

            <a href="https://github.com/femboysobak" target="_blank" class="btn btn-github">
                GitHub
            </a>
        </div>
    </div>

</body>
</html>
