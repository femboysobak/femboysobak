<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Где меня найти</title>
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            /* Основной фон как на картинке */
            background-color: #c7b3f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 360px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #3b2863;
            letter-spacing: -0.2px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Кнопки в стиле Material You Pill/Container */
        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 24px;
            border-radius: 28px; /* Капсульная форма Material 3 */
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: #2b184f;
            background-color: #e6dbff; /* Светло-фиолетовый тон Material You */
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            border: none;
        }

        /* Эффект нажатия и наведения по гайдлайнам Google */
        .btn:hover {
            background-color: #ded0ff;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(43, 24, 79, 0.08);
        }

        .btn:active {
            transform: scale(0.98);
            background-color: #d3c0f9;
        }

        /* Иконка слева в Material стиле */
        .btn i {
            font-size: 22px;
            margin-right: 16px;
            color: #553b88;
            width: 24px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Где меня найти:</h1>

        <div class="links">
            <a href="https://t.me/xxpeakx" target="_blank" class="btn">
                <i class="fa-brands fa-telegram"></i>
                <span>Telegram</span>
            </a>

            <a href="https://discordapp.com/users/1464303389646000261" target="_blank" class="btn">
                <i class="fa-brands fa-discord"></i>
                <span>Discord</span>
            </a>

            <a href="https://steamcommunity.com/profiles/76561199866082489" target="_blank" class="btn">
                <i class="fa-brands fa-steam"></i>
                <span>Steam</span>
            </a>

            <a href="https://github.com/femboysobak" target="_blank" class="btn">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>
    </div>

</body>
</html>
