<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои соцсети</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            background: #161b22;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        /* Telegram: Фирменный голубой цвет текста и рамки */
        .btn-telegram {
            color: #24A1DE;
            border-color: rgba(36, 161, 222, 0.3);
        }
        .btn-telegram:hover {
            background: rgba(36, 161, 222, 0.1);
            border-color: #24A1DE;
        }

        /* Discord: Фирменный фиолетово-синий цвет текста и рамки */
        .btn-discord {
            color: #5865F2;
            border-color: rgba(88, 101, 242, 0.3);
        }
        .btn-discord:hover {
            background: rgba(88, 101, 242, 0.1);
            border-color: #5865F2;
        }

        /* Steam: Фирменный сине-голубой цвет текста и рамки */
        .btn-steam {
            color: #66c0f4;
            border-color: rgba(102, 192, 244, 0.3);
        }
        .btn-steam:hover {
            background: rgba(102, 192, 244, 0.1);
            border-color: #66c0f4;
        }

        /* GitHub: Светлый фиолетово-серый / фирменный цвет */
        .btn-github {
            color: #a5d6ff;
            border-color: rgba(165, 214, 255, 0.3);
        }
        .btn-github:hover {
            background: rgba(165, 214, 255, 0.1);
            border-color: #a5d6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Где меня найти:</h1>

        <div class="links">
            <!-- Telegram -->
            <a href="https://t.me/xxpeakx" target="_blank" class="btn btn-telegram">
                Telegram
            </a>

            <!-- Discord -->
            <a href="https://discordapp.com/users/1464303389646000261" target="_blank" class="btn btn-discord">
                Discord
            </a>

            <!-- Steam -->
            <a href="https://steamcommunity.com/profiles/76561199866082489" target="_blank" class="btn btn-steam">
                Steam
            </a>

            <!-- GitHub -->
            <a href="https://github.com/femboysobak" target="_blank" class="btn btn-github">
                GitHub
            </a>
        </div>
    </div>

</body>
</html>
