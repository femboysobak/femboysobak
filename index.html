<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Где меня найти</title>
    <!-- Подключаем иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-color: #4a336e;
            background-image: 
                radial-gradient(circle at 50% 20%, #684a98 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, #362252 0%, transparent 70%),
                linear-gradient(135deg, #5b3e85 0%, #2f1c48 100%);
        }

        /* Обрушиваем сетку через SVG-фильтр (эффект мятой ткани) */
        .distorted-grid {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            filter: url(#crumple);
            pointer-events: none;
            z-index: 1;
        }

        /* Складки, тени от изгибов и текстурный шум */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj4KICA8ZmlsdGVyIGlkPSJub2lzZSI+CiAgICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44IiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+CiAgICA8ZmVDb2xvck1hdHJpeCB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMSAwIDAgMCAwICAwIDEgMCAwIDAgIDAgMCAxIDAgMCAgMCAwIDAgMC4xNSAwIi8+CiAgPC9maWx0ZXI+CiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIvPgo8L3N2Zz4='),
                radial-gradient(ellipse at 30% 40%, rgba(255, 255, 255, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 0, 0, 0.3) 0%, transparent 50%),
                linear-gradient(45deg, rgba(255,255,255,0.03) 0%, transparent 40%, rgba(0,0,0,0.2) 70%);
            background-repeat: repeat, no-repeat, no-repeat, no-repeat;
            pointer-events: none;
            z-index: 2;
            opacity: 0.9;
        }

        .container {
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 3;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 18px 24px;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: #2b184f;
            background-color: #e4d8ff;
            cursor: pointer;
            border: none;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background-color: #f0e8ff;
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #d3c0f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .btn i {
            font-size: 22px;
            margin-right: 16px;
            color: #553b88;
            width: 24px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .btn:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        .ripple {
            position: absolute;
            background: rgba(85, 59, 136, 0.25);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Невидимый SVG фильтр деформации для сетки -->
    <svg style="display: none;">
        <filter id="crumple">
            <feTurbulence type="turbulence" baseFrequency="0.015" numOctaves="3" result="turbulence" />
            <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="25" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- Искажённая мятая сетка -->
    <div class="distorted-grid"></div>

    <div class="container">
        <h1>Где меня найти:</h1>

        <div class="links">
            <a href="https://t.me/xxpeakx" target="_blank" class="btn">
                <i class="fa-brands fa-telegram"></i>
                <span>Telegram</span>
            </a>

            <a href="https://discordapp.com/users/1464303389646000261" target="_blank" class="btn">
                <i class="fa-brands fa-discord"></i>
                <span>Discord</span>
            </a>

            <a href="https://steamcommunity.com/profiles/76561199866082489" target="_blank" class="btn">
                <i class="fa-brands fa-steam"></i>
                <span>Steam</span>
            </a>

            <a href="https://github.com/femboysobak" target="_blank" class="btn">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;

                const rect = this.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = this.querySelector('.ripple');
                if (ripple) {
                    ripple.remove();
                }

                this.appendChild(circle);
            });
        });
    </script>
</body>
</html>
