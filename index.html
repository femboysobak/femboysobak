        /* Цветовые переменные тем */

            --text-color: #2b184f;
            --icon-color: #553b88;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --modal-bg: #2b184f;
            --modal-border: #684a98;
            --grid-color: rgba(255, 255, 255, 0.08);

        /* Тема Cyberpunk / Matrix */

            --bg-base: #05130e;
            --bg-gradient-1: #0a2e1d;
            --bg-gradient-2: #020d08;
            --bg-gradient-3: #082618;
            --bg-gradient-4: #010805;
            --card-bg: #00ff66;
            --card-hover: #66ff99;
            --card-active: #00cc52;
            --text-color: #021a0d;
            --icon-color: #02361a;
            --shadow-color: rgba(0, 255, 102, 0.15);
            --modal-bg: #031c11;
            --modal-border: #00ff66;
            --grid-color: rgba(0, 255, 102, 0.12);
        }

        /* Тема Synthwave / Sunset */
        [data-theme="synthwave"] {
            --bg-base: #220f35;
            --bg-gradient-1: #ff2a74;
            --bg-gradient-2: #210a38;
            --bg-gradient-3: #7b1fa2;
            --bg-gradient-4: #0f051d;
            --card-bg: #ff75c3;
            --card-hover: #ffa3d7;
            --card-active: #e052a3;
            --text-color: #2a0422;
            --icon-color: #6a094a;
            --shadow-color: rgba(255, 42, 116, 0.25);
            --modal-bg: #1c0628;
            --modal-border: #ff2a74;
            --grid-color: rgba(255, 117, 195, 0.15);
        }

        /* Тема Dark Minimal */
        [data-theme="dark"] {
            --bg-base: #121212;
            --bg-gradient-1: #242424;
            --bg-gradient-2: #0d0d0d;
            --bg-gradient-3: #1a1a1a;
            --bg-gradient-4: #050505;
            --card-bg: #2a2a2a;
            --card-hover: #383838;
            --card-active: #1f1f1f;
            --text-color: #ffffff;
            --icon-color: #b0b0b0;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --modal-bg: #1e1e1e;
            --modal-border: #444444;
            --grid-color: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 20%, var(--bg-gradient-1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, var(--bg-gradient-2) 0%, transparent 70%),
                linear-gradient(135deg, var(--bg-gradient-3) 0%, var(--bg-gradient-4) 100%);
            transition: background 0.4s ease;
        }

        /* Мятая сетка */
        .distorted-grid {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 24px 24px;
            filter: url(#crumple);
            pointer-events: none;
            z-index: 1;
        }

        /* Зернистость */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj4KICA8aWx0ZXIgaWQ9Im5vaXNlIj4KICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44IiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+CiAgICA8ZmVDb2xvck1hdHJpeCB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMSAwIDAgMCAwICAwIDEgMCAwIDAgIDAgMCAxIDAgMCAgMCAwIDAgMC4xNSAwIi8+CiAgPC9maWx0ZXI+CiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIvPgo8L3N2Zz4='),
                radial-gradient(ellipse at 30% 40%, rgba(255, 255, 255, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 0, 0, 0.3) 0%, transparent 50%),

            background-repeat: repeat, no-repeat, no-repeat, no-repeat;
            pointer-events: none;
            z-index: 2;
            opacity: 0.9;
        }

        .container {
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 3;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;

            gap: 14px;
        }

        .link-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 18px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: var(--text-color);
            background-color: var(--card-bg);
            cursor: pointer;
            border: none;
            overflow: hidden;
            flex: 1;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1),
                        color 0.3s ease;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .btn:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: var(--card-active);
        }

        .btn i {
            font-size: 22px;
            margin-right: 16px;
            color: var(--icon-color);
            width: 24px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), color 0.3s ease;
        }

        .btn:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        .copy-btn {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 20px;
            background-color: var(--card-bg);
            color: var(--icon-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 16px var(--shadow-color);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1),
                        color 0.3s ease;
        }

        .copy-btn:hover {
            background-color: var(--card-hover);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .copy-btn:active {
            transform: scale(0.92);
            background-color: var(--card-active);
        }

        .copy-btn i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .copy-btn:hover i {
            transform: scale(1.15);
        }

        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: 0 4px 20px var(--shadow-color);
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Кнопка с собакой (снизу слева) */
        .dog-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: var(--card-bg);
            color: var(--icon-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 16px var(--shadow-color);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .dog-btn:hover {
            transform: scale(1.1) rotate(12deg);
            background-color: var(--card-hover);
        }

        /* Счётчик посещений (снизу справа) */
        .visitor-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);

            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;

            align-items: center;
            gap: 8px;
            z-index: 10;
            box-shadow: 0 4px 16px var(--shadow-color);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .visitor-counter:hover {
            transform: scale(1.05);
        }

        .visitor-counter i {
            color: var(--icon-color);
            font-size: 16px;
        }

        /* Кнопка с ноутбуком (справа вверху) */
        .specs-btn {
            position: fixed;
            top: 20px;
            right: 78px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--card-bg);
            color: var(--icon-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 16px var(--shadow-color);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .specs-btn:hover {
            transform: scale(1.1) rotate(-10deg);
            background-color: var(--card-hover);
        }

        /* Кнопка переключения тем (справа вверху) */
        .theme-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--card-bg);
            color: var(--icon-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 16px var(--shadow-color);
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
        }

        .theme-btn:hover {
            transform: scale(1.1) rotate(20deg);
            background-color: var(--card-hover);
        }

        /* Меню выбора темы */
        .theme-menu {
            position: fixed;
            top: 76px;
            right: 20px;
            background-color: var(--modal-bg);
            border: 2px solid var(--modal-border);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .theme-menu.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .theme-opt {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .theme-opt:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .theme-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--modal-bg);
            border: 2px solid var(--modal-border);
            padding: 20px;
            border-radius: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card img {
            width: 100%;
            border-radius: 16px;
            display: block;
            margin-bottom: 12px;
        }

        .close-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 20px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .specs-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            text-align: left;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 16px;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .specs-list span {
            opacity: 0.75;
        }

        .specs-list strong {
            font-weight: 600;
        }
    </style>
</head>

    <div class="toast" id="toast">Ник скопирован!</div>

    <script>
        // Загрузка счётчика посещений через API (используем уникальный namespace/key для твоего сайта)
        fetch('https://api.counterapi.dev/v1/femboysobak/site-visits/up')
            .then(response => response.json())
            .then(data => {
                document.getElementById('visitCount').innerText = data.count;
            })
            .catch(error => {
                // Запасной вариант, если API временно недоступно
                document.getElementById('visitCount').innerText = '100+';
            });

        // Ripple эффект
        document.querySelectorAll('.btn, .copy-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;

                const rect = this.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = this.querySelector('.ripple');
                if (ripple) ripple.remove();

                this.appendChild(circle);
            });
        });

        // Функция копирования
        let toastTimeout;
        function copyNickname(text, serviceName) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = `${serviceName} ник скопирован!`;
                toast.classList.add('show');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            });
        }

        // Модалка собаки
        function toggleModal(show) {
            const modal = document.getElementById('dogModal');
            modal.classList.toggle('active', show);
        }

        // Модалка характеристик
        function toggleSpecsModal(show) {
            const modal = document.getElementById('specsModal');
            modal.classList.toggle('active', show);
        }

        // Логика тем
        function toggleThemeMenu() {
            const menu = document.getElementById('themeMenu');
            menu.classList.toggle('active');
        }

        function setTheme(themeName) {
            if (themeName === 'default') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('user-theme');
            } else {
                document.documentElement.setAttribute('data-theme', themeName);
                localStorage.setItem('user-theme', themeName);
            }
            document.getElementById('themeMenu').classList.remove('active');
        }

        // Сохранение и загрузка темы из памяти
        const savedTheme = localStorage.getItem('user-theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Закрывать меню тем при клике мимо
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('themeMenu');
            const btn = document.querySelector('.theme-btn');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
