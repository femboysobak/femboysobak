<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Иконки Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-color: #4a336e;
            background-image: 
                radial-gradient(circle at 50% 20%, #684a98 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, #362252 0%, transparent 70%),
                linear-gradient(135deg, #5b3e85 0%, #2f1c48 100%);
        }

        /* Мятая сетка */
        .distorted-grid {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            filter: url(#crumple);
            pointer-events: none;
            z-index: 1;
        }

        /* Зернистость и эффекты */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj4KICA8ZmlsdGVyIGlkPSJub2lzZSI+CiAgICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44IiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+CiAgICA8ZmVDb2xvck1hdHJpeCB0eXBlPSJtYXRyaXgiIHZhbHVlcz0iMSAwIDAgMCAwICAwIDEgMCAwIDAgIDAgMCAxIDAgMCAgMCAwIDAgMC4xNSAwIi8+CiAgPC9maWx0ZXI+CiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI25vaXNlKSIvPgo8L3N2Zz4='),
                radial-gradient(ellipse at 30% 40%, rgba(255, 255, 255, 0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 0, 0, 0.3) 0%, transparent 50%),
                linear-gradient(45deg, rgba(255,255,255,0.03) 0%, transparent 40%, rgba(0,0,0,0.2) 70%);
            background-repeat: repeat, no-repeat, no-repeat, no-repeat;
            pointer-events: none;
            z-index: 2;
            opacity: 0.9;
        }

        .container {
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 3;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Контейнер для строки (ссылка + кнопка копирования) */
        .link-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Основная кнопка ссылки */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 18px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            color: #2b184f;
            background-color: #e4d8ff;
            cursor: pointer;
            border: none;
            overflow: hidden;
            flex: 1;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background-color: #f0e8ff;
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #d3c0f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .btn i {
            font-size: 22px;
            margin-right: 16px;
            color: #553b88;
            width: 24px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .btn:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        /* Квадратная кнопка копирования */
        .copy-btn {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 20px;
            background-color: #e4d8ff;
            color: #553b88;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1),
                        background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .copy-btn:hover {
            background-color: #f0e8ff;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .copy-btn:active {
            transform: scale(0.92);
            background-color: #d3c0f9;
        }

        .copy-btn i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .copy-btn:hover i {
            transform: scale(1.15);
        }

        .ripple {
            position: absolute;
            background: rgba(85, 59, 136, 0.25);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Уведомление о копировании */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: #e4d8ff;
            color: #2b184f;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Кнопка с собакой */
        .dog-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #e4d8ff;
            color: #553b88;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .dog-btn:hover {
            transform: scale(1.1) rotate(12deg);
            background-color: #f0e8ff;
        }

        /* Модалка с картинкой */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #2b184f;
            border: 2px solid #684a98;
            padding: 16px;
            border-radius: 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card img {
            width: 100%;
            border-radius: 16px;
            display: block;
            margin-bottom: 12px;
        }

        .close-btn {
            background: #e4d8ff;
            color: #2b184f;
            border: none;
            padding: 8px 20px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="dogModal" onclick="toggleModal(false)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <img src="photo_2026-08-25_02-10-40.jpg" alt="Собака">

        </div>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast">Ник скопирован!</div>

    <script>
        // Ripple-эффект
        document.querySelectorAll('.btn, .copy-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;

                const rect = this.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = this.querySelector('.ripple');
                if (ripple) {
                    ripple.remove();
                }

                this.appendChild(circle);
            });
        });

        // Функция копирования
        let toastTimeout;
        function copyNickname(text, serviceName) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.innerText = `${serviceName} ник скопирован!`;
                toast.classList.add('show');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            });
        }

        // Модальное окно с собакой
        function toggleModal(show) {
            const modal = document.getElementById('dogModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }
    </script>
